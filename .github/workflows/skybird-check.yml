# SkyBird hourly check: puts each post into Buffer about 2 hours before its time (so
# only a few wait in Buffer at once; the free plan allows 10), then asks Buffer whether
# earlier posts really went out and sends a phone alert if one failed. Doesn't use OpenSky.
name: SkyBird post check

on:
  schedule:
    # Every hour from about 6 AM to 8 PM Central (GitHub runs on UTC, so the hours cover
    # summer and winter time). A run with nothing due does nothing; it doesn't commit.
    - cron: "35 11-23 * * *"
    - cron: "35 0-1 * * *"
  workflow_dispatch:
    inputs:
      connect_buffer:
        description: "Only look up the Buffer channels and list their IDs (for the BUFFER_CHANNEL_* secrets)"
        type: boolean
        default: false

concurrency:
  group: skybird
  cancel-in-progress: false

jobs:
  check:
    # One job per city (cities/<city>.toml), one at a time so they share SkyBird's memory.
    # Kansas City is in its quiet build (dry run: it posts nothing).
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        city: [omaha, kc]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Restore SkyBird's memory (today's scheduled posts)
        uses: actions/cache/restore@v6
        with:
          path: cloud/data
          key: skybird-data-${{ github.run_id }}-${{ matrix.city }}
          restore-keys: skybird-data-

      - name: Put due posts into Buffer; check earlier ones went out
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_OMAHA_FACEBOOK: ${{ secrets.BUFFER_CHANNEL_OMAHA_FACEBOOK }}
          BUFFER_CHANNEL_OMAHA_TIKTOK: ${{ secrets.BUFFER_CHANNEL_OMAHA_TIKTOK }}
          BUFFER_CHANNEL_OMAHA_INSTAGRAM: ${{ secrets.BUFFER_CHANNEL_OMAHA_INSTAGRAM }}
          BUFFER_CHANNEL_KC_TIKTOK: ${{ secrets.BUFFER_CHANNEL_KC_TIKTOK }}
          BUFFER_CHANNEL_KC_FACEBOOK: ${{ secrets.BUFFER_CHANNEL_KC_FACEBOOK }}
          BUFFER_CHANNEL_KC_INSTAGRAM: ${{ secrets.BUFFER_CHANNEL_KC_INSTAGRAM }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m skybird --config cloud/config.toml --city ${{ matrix.city }} cloud-run ${{ inputs.connect_buffer && '--connect' || '--check-posts' }}

      - name: Save SkyBird's memory
        if: always()
        uses: actions/cache/save@v6
        with:
          path: cloud/data
          key: skybird-data-${{ github.run_id }}-${{ matrix.city }}
