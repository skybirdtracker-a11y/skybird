# SkyBird daily posts: makes the 4 videos in the cloud at ~3:35 AM and schedules
# them in Buffer at 9 / 11 / 1 / 6 Central. Your PC can be off.
# Setup steps: CLOUD-SETUP.md. Keys go in Settings → Secrets and variables → Actions.
name: SkyBird daily posts

on:
  schedule:
    # About 3:35 AM Central, right after the flight day (3:30 AM to 3:29 AM) ends.
    # GitHub runs on UTC: 8:35 UTC = 3:35 AM in summer (CDT); in winter (CST) that's
    # 2:35 AM, which SkyBird skips as too early, and the 9:35 UTC run does it instead.
    - cron: "35 8 * * *"
    # Backup an hour later in case GitHub skipped or delayed the first one.
    # It does nothing if the day's posts are already scheduled.
    - cron: "35 9 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test run: make the videos but schedule nothing in Buffer"
        type: boolean
        default: false
      force:
        description: "Run again even if today's posts were already scheduled"
        type: boolean
        default: false
      only:
        description: "Remake just one post (the others stay as scheduled)"
        type: choice
        default: "every post"
        options:
          - "every post"
          - "commercial"
          - "private"
          - "military"
          - "all (All airports + planes)"
      day:
        description: "Which day's post to remake, YYYY-MM-DD (blank = today's, showing yesterday's flights)"
        type: string
        default: ""
      test_notification:
        description: "Only send a test notification to your phone (makes no videos, posts nothing)"
        type: boolean
        default: false
      check_hosts:
        description: "Only test which video hosts accept uploads (makes no videos, posts nothing)"
        type: boolean
        default: false
      post_time:
        description: "Post time today, HH:MM in 24h Central, e.g. 19:30 (blank = its usual time)"
        type: string
        default: ""

concurrency:
  group: skybird
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Find SkyBird's files
        # Works even if the files were uploaded inside a folder (e.g. skybird-cloud/)
        run: |
          if [ ! -f requirements.txt ]; then
            found=$(find . -name requirements.txt -not -path './.git/*' | head -1)
            if [ -z "$found" ]; then
              echo "::error::SkyBird's files aren't in this repository. Upload the skybird and cloud folders, events.toml and requirements.txt."
              exit 1
            fi
            dir=$(dirname "$found")
            echo "SkyBird's files are in $dir; using them from there."
            cp -r "$dir"/. .
          fi
          for f in skybird cloud/config.toml events.toml; do
            [ -e "$f" ] || { echo "::error::Missing $f. Upload it to the repository."; exit 1; }
          done

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Restore SkyBird's memory (aircraft types, tag history)
        uses: actions/cache/restore@v6
        with:
          path: cloud/data
          key: skybird-data-${{ github.run_id }}
          restore-keys: skybird-data-

      - name: Make the videos and schedule them in Buffer
        env:
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ONLY: ${{ inputs.only }}
          DAY: ${{ inputs.day }}
          POST_TIME: ${{ inputs.post_time }}
        run: |
          only="${ONLY%% *}"; [ "$only" = "every" ] && only=""
          python -m skybird --config cloud/config.toml cloud-run \
            ${{ inputs.force && '--force' || '' }} ${{ inputs.dry_run && '--dry-run' || '' }} \
            --only "$only" --day "$DAY" --at "$POST_TIME" ${{ inputs.check_hosts && '--check-hosts' || '' }} ${{ inputs.test_notification && '--test-notify' || '' }}

      - name: Save SkyBird's memory
        if: always()
        uses: actions/cache/save@v6
        with:
          path: cloud/data
          key: skybird-data-${{ github.run_id }}

      - name: Keep today's videos for 3 days (download them from this run's page)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: skybird-videos-${{ github.run_number }}
          path: cloud/videos/*.mp4
          retention-days: 3
          if-no-files-found: ignore
