# SkyBird city profile: Omaha (the default city; every command without --city runs it).
# Shared settings (post times, testing, hashtags...) live in cloud/config.toml; a city can
# replace any of those sections under [config.<section>] (see cities/kc.toml).
id = "omaha"
name = "Omaha"
brand = "SkyBird - Omaha"
handle = "@skybirdomaha"
hashtag = "#SkyBirdOmaha"
timezone = "America/Chicago"
flight_day_start = "03:30"
platforms = ["facebook", "tiktok"]   # Instagram paused Nov 4, 2026
hub = "KOMA"
hub_name = "Eppley"                  # how captions name the hub airport
board_check = true                   # compare arrivals with flyoma.com's arrivals board
# Until the BUFFER_CHANNEL_OMAHA_FACEBOOK / _TIKTOK secrets are added, Omaha uses the Buffer
# account's Facebook and TikTok channels by kind (never one set for another city).
# Remove this line once the secrets are in.
buffer_lookup_fallback = true

[airports]   # ICAO = [short name, role]: hub, ga, business, military
KOMA = ["Eppley", "hub"]
KMLE = ["Millard", "ga"]
KCBF = ["Council Bluffs", "ga"]
KOFF = ["Offutt", "military"]
