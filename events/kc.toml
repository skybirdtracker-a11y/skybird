# SkyBird - Kansas City event calendar (Nov 2026 – Apr 2027). Same fields as events/omaha.toml, plus:
#
#   match = "flight_day"   start/end are the event's real dates. Its hook goes on the posts
#                          that SHOW those days' flights (2-day lag: a Sunday game is on
#                          Tuesday's posts); the lead-up teaser runs on the posts from
#                          lead_days before the event through its first day.
#   gameday = true         Chiefs home games: that day's private post becomes "Game-day private
#                          jets" (posted with the lag).
#
# Brand rules: never name people. Concerts are listed by venue, never by the artist.
# confirmed = false: the date came from a third-party listing or isn't final; re-check it.
# Researched Nov 4, 2026 (Chiefs schedule as reported by CBS Sports, Fox Sports and Yahoo
# Sports; venues from Visit KC, T-Mobile Center and ticket listings).

# ============================== November 2026 ==============================

