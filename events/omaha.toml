# SkyBird - Omaha event calendar  (Oct 2026 – Dec 2027)
#
# On any day inside an event (or its lead-up window) the auto-poster:
#   • adds the event's caption hook to that day's captions
#   • pre-checks the event hashtags
#   • shows the "bonus post" ideas as a banner in the approval dashboard
#
# Fields:
#   start / end     dates the event affects posts (inclusive)
#   confirmed       false = date estimated from the usual pattern; re-check before then
#   priority        higher wins when two events overlap (1–5)
#   lead_days       days before `start` to run the teaser (`lead_hook`)
#   slots           which posts get the hook: "all_posts" or any of commercial/private/military/all
#   hook            one line added to captions during the event
#   bonus_posts     ideas for extra posts (you make those by hand or with a custom render)
#   news_tag        true = a big "who's in town" event: the 6 PM post may tag ONE local news
#                   outlet (WOWT, KMTV, KETV or the World-Herald). Never on ordinary days.
#
# Add an event: copy a block, change the fields. The dashboard picks it up on the next build.

